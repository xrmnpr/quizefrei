services:
  postgres:
    image: postgres:16-alpine
    container_name: quiz-efrei-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: quiz_user
      POSTGRES_PASSWORD: quiz_password
      POSTGRES_DB: quiz_efrei
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quiz_user -d quiz_efrei"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
